name: Start test and build

on:
  push:
    branches:
      - addMusicInProject
      - addTestsInProject
      - addPokerCore_CreateMainCode
      - MainBranchForAllProject
      - TestBranch_Not_Use_In_Main_Programm
  pull_request:
    branches:
      - addMusicInProject
      - addTestsInProject
      - addPokerCore_CreateMainCode
      - MainBranchForAllProject
      - TestBranch_Not_Use_In_Main_Programm


jobs:
  test:
    name: Run C++ tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: sudo apt-get install -y g++ cmake libgtest-dev libasound2-dev libjack-dev
        
      - name: Clone RtAudio
        run: git clone --depth 1 https://github.com/thestk/rtaudio.git libs/rtaudio
        
      - name: Verify RtAudio build
        run: ls -la libs/rtaudio/build/lib*
        
      - name: Build and run tests
        run: |
          make test || (ls -la libs/rtaudio/build; exit 1)
          make clean

  build:
    name: build all project
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install g++ cmake libgtest-dev libasound2-dev

      - name: Clone RtAudio
        run: git clone --depth 1 https://github.com/thestk/rtaudio.git libs/rtaudio

      - name: Build project
        run: |
          export LD_LIBRARY_PATH=libs/rtaudio/build:$LD_LIBRARY_PATH
          make
          make clean
