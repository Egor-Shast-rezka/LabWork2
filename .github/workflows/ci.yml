name: Start test and build

on:
  push:
    branches:
      - addMusicInProject
      - addTestsInProject
      - addPokerCore_CreateMainCode
      - MainBranchForAllProject
      - TestBranch_Not_Use_In_Main_Programm
  pull_request:
    branches:
      - addMusicInProject
      - addTestsInProject
      - addPokerCore_CreateMainCode
      - MainBranchForAllProject
      - TestBranch_Not_Use_In_Main_Programm


jobs:
  test:
    name: Run C++ tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install g++ cmake libgtest-dev

      - name: Build and run tests
        run: |
          make all_test
          make clean

  build:
    name: build all project
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install g++ cmake libgtest-dev

      - name: Build project
        run: make
