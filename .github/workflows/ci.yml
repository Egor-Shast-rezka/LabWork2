name: Start test and build

on:
  push:
    branches:
      - MainBranchForAllProject
  pull_request:
    branches:
      - MainBranchForAllProject


jobs:
  test:
    name: Run C++ testsMore actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install g++ cmake libgtest-dev

      - name: Build and run tests
        run: |
          make test_base
          make test_bot
          make test_game
          make test_char
          make test_mode
          make clean

  build:
    name: build all project
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install g++ cmake libgtest-dev

      - name: Build project
        run: make
